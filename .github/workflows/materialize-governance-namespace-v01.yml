name: Materialize Governance namespace split

on:
  push:
    branches:
      - cla-framework-v0.1
    paths:
      - 'tools/migrate_governance_namespace_v01.py'
      - '.github/workflows/materialize-governance-namespace-v01.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout governance branch
        uses: actions/checkout@v4
        with:
          ref: cla-framework-v0.1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Migrate Governance namespace
        run: python tools/migrate_governance_namespace_v01.py

      - name: Commit transformed sources
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Governance namespace already normalized'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Materialize Governance namespace split'
          git push origin HEAD:cla-framework-v0.1
