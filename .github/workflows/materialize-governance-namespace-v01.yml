name: Materialize Governance namespace split

on:
  push:
    branches:
      - cla-framework-v0.1
    paths:
      - 'tools/migrate_governance_namespace_v01.py'
      - '.github/workflows/materialize-governance-namespace-v01.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout governance branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: cla-framework-v0.1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Migrate Governance namespace
        run: python tools/migrate_governance_namespace_v01.py

      - name: Commit transformed sources
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]]; then
            echo 'Governance namespace already normalized'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Materialize Governance namespace split'
          git push origin HEAD:cla-framework-v0.1
