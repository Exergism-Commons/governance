name: Governance integrity

on:
  push:
    paths:
      - 'README.md'
      - 'ARCHITECTURE.md'
      - 'CONSTITUTION.md'
      - 'FOUNDING-STEWARDSHIP.md'
      - 'MEMBERSHIP.md'
      - 'CONTRIBUTING.md'
      - 'IP-POLICY.md'
      - 'OPEN-KNOWLEDGE-POLICY.md'
      - 'architecture/**'
      - 'cla/**'
      - 'policy/**'
      - 'records/**'
      - 'spec/**'
      - 'ontology/**'
      - 'tools/**'
      - '.github/workflows/governance-integrity.yml'
  pull_request:
    paths:
      - 'README.md'
      - 'ARCHITECTURE.md'
      - 'CONSTITUTION.md'
      - 'FOUNDING-STEWARDSHIP.md'
      - 'MEMBERSHIP.md'
      - 'CONTRIBUTING.md'
      - 'IP-POLICY.md'
      - 'OPEN-KNOWLEDGE-POLICY.md'
      - 'architecture/**'
      - 'cla/**'
      - 'policy/**'
      - 'records/**'
      - 'spec/**'
      - 'ontology/**'
      - 'tools/**'
      - '.github/workflows/governance-integrity.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      # Full history is required because content-addressed governance records and
      # established Member provenance are append-only across merged history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Validate governance invariants and adversarial mutation classes
        shell: bash
        env:
          EC_GOVERNANCE_HISTORY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          {
            python tools/validate.py
            python tools/test_governance_mutation_guards.py
            python tools/test_historical_authority_guards.py
            python tools/test_event_release_authority_guards.py
            python tools/test_interrelease_integrity_guards.py
            python tools/test_interrelease_hardening_guards.py
          } 2>&1 | tee governance-integrity.log
      - name: Persist validator diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: governance-integrity-${{ github.run_id }}
          path: governance-integrity.log
          if-no-files-found: error
          retention-days: 30
