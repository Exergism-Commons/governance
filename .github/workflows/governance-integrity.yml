name: Governance integrity

on:
  push:
    paths:
      - 'README.md'
      - 'ARCHITECTURE.md'
      - 'CONSTITUTION.md'
      - 'FOUNDING-STEWARDSHIP.md'
      - 'MEMBERSHIP.md'
      - 'CONTRIBUTING.md'
      - 'IP-POLICY.md'
      - 'OPEN-KNOWLEDGE-POLICY.md'
      - 'architecture/**'
      - 'cla/**'
      - 'policy/**'
      - 'records/**'
      - 'spec/**'
      - 'ontology/**'
      - 'tools/**'
      - '.github/workflows/governance-integrity.yml'
      - '.github/workflows/materialize-governance-namespace-v01.yml'
  pull_request:
    paths:
      - 'README.md'
      - 'ARCHITECTURE.md'
      - 'CONSTITUTION.md'
      - 'FOUNDING-STEWARDSHIP.md'
      - 'MEMBERSHIP.md'
      - 'CONTRIBUTING.md'
      - 'IP-POLICY.md'
      - 'OPEN-KNOWLEDGE-POLICY.md'
      - 'architecture/**'
      - 'cla/**'
      - 'policy/**'
      - 'records/**'
      - 'spec/**'
      - 'ontology/**'
      - 'tools/**'
      - '.github/workflows/governance-integrity.yml'
      - '.github/workflows/materialize-governance-namespace-v01.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      # Full history is required because content-addressed governance records and
      # established Member provenance are append-only across merged history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Validate governance invariants and adversarial mutation classes
        shell: bash
        env:
          EC_GOVERNANCE_PUSH_BASE: ${{ github.event.before }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          # On pull_request GitHub checks out its synthetic merge commit. Its
          # first parent is the exact base revision against which this verdict
          # is being produced; event payload base.sha can lag behind main after
          # the PR was opened. Push runs instead compare with event.before.
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            export EC_GOVERNANCE_HISTORY_BASE="$(git rev-parse HEAD^1)"
          else
            export EC_GOVERNANCE_HISTORY_BASE="${EC_GOVERNANCE_PUSH_BASE}"
          fi
          LOG_PATH="${RUNNER_TEMP}/governance-integrity.log"
          {
            python tools/validate.py
            python tools/test_governance_mutation_guards.py
            python tools/test_namespace_materialization_guards.py
            python tools/test_historical_authority_guards.py
            python tools/test_event_release_authority_guards.py
            python tools/test_interrelease_integrity_guards.py
            python tools/test_interrelease_hardening_guards.py
            python tools/test_path_integrity_guards.py
          } 2>&1 | tee "${LOG_PATH}"
      - name: Persist validator diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: governance-integrity-${{ github.run_id }}
          path: ${{ runner.temp }}/governance-integrity.log
          if-no-files-found: error
          retention-days: 30
