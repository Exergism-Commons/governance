name: Governance integrity

on:
  push:
    paths:
      - 'README.md'
      - 'ARCHITECTURE.md'
      - 'CONSTITUTION.md'
      - 'FOUNDING-STEWARDSHIP.md'
      - 'MEMBERSHIP.md'
      - 'CONTRIBUTING.md'
      - 'IP-POLICY.md'
      - 'architecture/**'
      - 'cla/**'
      - 'policy/**'
      - 'spec/**'
      - 'ontology/**'
      - 'tools/**'
      - '.github/workflows/governance-integrity.yml'
  pull_request:
    paths:
      - 'README.md'
      - 'ARCHITECTURE.md'
      - 'CONSTITUTION.md'
      - 'FOUNDING-STEWARDSHIP.md'
      - 'MEMBERSHIP.md'
      - 'CONTRIBUTING.md'
      - 'IP-POLICY.md'
      - 'architecture/**'
      - 'cla/**'
      - 'policy/**'
      - 'spec/**'
      - 'ontology/**'
      - 'tools/**'
      - '.github/workflows/governance-integrity.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate governance invariants
        run: python tools/validate_governance.py
