name: Governance integrity

on:
  push:
    paths:
      - 'README.md'
      - 'ARCHITECTURE.md'
      - 'CONSTITUTION.md'
      - 'FOUNDING-STEWARDSHIP.md'
      - 'MEMBERSHIP.md'
      - 'CONTRIBUTING.md'
      - 'IP-POLICY.md'
      - 'OPEN-KNOWLEDGE-POLICY.md'
      - 'architecture/**'
      - 'cla/**'
      - 'policy/**'
      - 'records/**'
      - 'spec/**'
      - 'ontology/**'
      - 'tools/**'
      - '.github/workflows/governance-integrity.yml'
  pull_request:
    paths:
      - 'README.md'
      - 'ARCHITECTURE.md'
      - 'CONSTITUTION.md'
      - 'FOUNDING-STEWARDSHIP.md'
      - 'MEMBERSHIP.md'
      - 'CONTRIBUTING.md'
      - 'IP-POLICY.md'
      - 'OPEN-KNOWLEDGE-POLICY.md'
      - 'architecture/**'
      - 'cla/**'
      - 'policy/**'
      - 'records/**'
      - 'spec/**'
      - 'ontology/**'
      - 'tools/**'
      - '.github/workflows/governance-integrity.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate governance invariants and adversarial mutation classes
        shell: bash
        run: |
          set -o pipefail
          {
            python tools/validate.py
            python tools/test_governance_mutation_guards.py
          } 2>&1 | tee governance-integrity.log
      - name: Persist validator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-integrity-${{ github.run_id }}
          path: governance-integrity.log
          if-no-files-found: error
          retention-days: 30
